[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simone"
version = "0.2.0"
description = "AI-powered Sigma detection rule generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.54",
    "pydantic-ai-slim[mcp]>=2.54",
    "sigma-mcp-server>=0.2",
    "httpx>=0.28",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.scripts]
simone = "simone.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
