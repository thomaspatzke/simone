[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigma-ai"
version = "0.1.0"
description = "AI-powered Sigma detection rule generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.0",
    "pysigma>=2.0",
    "httpx>=0.28",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.scripts]
sigma-ai = "sigma_ai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma_ai"]
